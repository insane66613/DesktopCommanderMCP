workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - test

variables:
  CI: "true"
  PUPPETEER_SKIP_DOWNLOAD: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

default:
  image: node:20-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline

validate_tools:
  stage: validate
  timeout: 20m
  script:
    - mkdir -p ci-logs
    - bash -o pipefail -c 'npm run validate:tools 2>&1 | tee ci-logs/validate-tools.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-logs/

unit_tests:
  stage: test
  timeout: 30m
  script:
    - mkdir -p ci-logs
    - bash -o pipefail -c 'npm test 2>&1 | tee ci-logs/unit-tests.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-logs/

integration_tests:
  stage: test
  timeout: 45m
  script:
    - mkdir -p ci-logs
    - bash -o pipefail -c 'npm run test:integration 2>&1 | tee ci-logs/integration-tests.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-logs/
