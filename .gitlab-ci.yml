workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - test

variables:
  CI: "true"
  PUPPETEER_SKIP_DOWNLOAD: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

default:
  image: node:24-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline

validate_tools:
  stage: validate
  timeout: 20m
  script:
    - mkdir -p ci-logs
    - bash -o pipefail -c 'npm run validate:tools 2>&1 | tee ci-logs/validate-tools.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-logs/

unit_tests:
  stage: test
  timeout: 30m
  before_script:
    - !reference [default, before_script]
    - apt-get update
    - apt-get install -y --no-install-recommends chromium chromium-sandbox fonts-liberation
    # Avoid the image's "node" account: log-redaction tests deliberately mask
    # the current username, which would otherwise mask the Node executable name.
    - useradd --create-home --shell /bin/sh dc-ci
    - chown -R dc-ci:dc-ci "$CI_PROJECT_DIR"
  script:
    - mkdir -p ci-logs
    - |
      test_status=0
      runuser -u dc-ci -- npm test > ci-logs/unit-tests.log 2>&1 || test_status=$?
      tail -n 80 ci-logs/unit-tests.log
      exit "$test_status"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-logs/

integration_tests:
  stage: test
  timeout: 45m
  script:
    - mkdir -p ci-logs
    - bash -o pipefail -c 'npm run test:integration 2>&1 | tee ci-logs/integration-tests.log'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-logs/
